x-production-environment: &production-environment
  FLASK_ENV: production
  DEBUG: "false"
  TESTING: "false"
  SECRET_KEY: ${SECRET_KEY:?Set a strong SECRET_KEY}

services:
  api:
    restart: unless-stopped
    environment: *production-environment
    ports: ["127.0.0.1:${BACKEND_PORT:?Set the existing Nginx upstream port}:5000"]
    # Defaults match the existing repository's Gunicorn command; verify VPS units.
    command: >-
      gunicorn --bind 0.0.0.0:5000
      --workers ${GUNICORN_WORKERS:-1} --timeout ${GUNICORN_TIMEOUT:-30}
      --access-logfile - --error-logfile - "app:create_app()"
  db:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  celery_worker:
    restart: unless-stopped
    environment: *production-environment
    command: >-
      celery -A app.celery_app.celery worker --loglevel=info
      --concurrency=${CELERY_WORKER_CONCURRENCY:-0} --queues=${CELERY_QUEUES:-celery}
  celery_beat:
    restart: unless-stopped
    environment: *production-environment
