name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --- Orval 自動生成 ---
      - name: Generate API client with Orval
        env:
          ORVAL_API_URL: ${{ secrets.ORVAL_API_URL }}

        run: |
          echo "Running Orval with API: $ORVAL_API_URL"
          npm run orval

      - name: Run Lint
        run: npm run lint --if-present

      - name: Run Type Check
        run: npm run type-check --if-present

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_API_BASE_URL: https://api.anzai-home.com/mahjong
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
