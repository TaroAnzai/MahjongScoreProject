name: Frontend CI/CD

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - 'Backend CI/CD'
    types:
      - completed

jobs:
  build:
    name: Build Frontend
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main') ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate API client with Orval
        env:
          ORVAL_API_URL: ${{ secrets.ORVAL_API_URL }}
        run: npm run orval
      - name: Run Lint
        run: npm run lint --if-present
      - name: Run Type Check
        run: npm run type-check --if-present
      - name: Test
        run: npm test
      - name: Build
        env:
          VITE_API_BASE_URL: https://api.anzai-home.com/mahjong
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build
    if: >-
      ${{
        needs.build.result == 'success' &&
        ((github.event_name == 'workflow_run' &&
          github.event.workflow_run.head_branch == 'main') ||
         (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'))
      }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Deploy via SSH (scp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_FRONT_HOST }}
          username: ${{ secrets.VPS_FRONT_USER }}
          port: ${{ secrets.VPS_FRONT_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/*'
          target: '/home/r6441231/public_html/anzai-home.com/mahjong/'
          strip_components: 1
