services:
  api:
    build: ./backend
    container_name: mahjongscore-api
    # ホストには公開しない
    expose:
      - '5000'
    command: >
      gunicorn -b 0.0.0.0:5000 "app:create_app()"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=mysql+pymysql://root:secret@db:3306/mahjongscore
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - db
      - redis

  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: mahjongscore-mitmproxy
    ports:
      - '6080:6080' # これまでと同じAPI入口
      - '127.0.0.1:8090:8090' # mitmweb GUI
    command:
      - mitmweb
      - --mode
      - reverse:http://api:5000
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - '6080'
      - --web-host
      - 0.0.0.0
      - --web-port
      - '8090'
      - --set
      - web_password=mahjong
    depends_on:
      - api

  db:
    image: mysql:8.0
    container_name: mahjongscore-db
    restart: always
    ports:
      - '3307:3306' # ホスト3307 → コンテナ3306
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=mahjongscore
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: mahjongscore-redis
    restart: always

  celery_worker:
    build: ./backend
    container_name: mahjongscore-celery
    command: celery -A app.celery_app.celery worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=mysql+pymysql://root:secret@db:3306/mahjongscore
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - db
      - redis

  celery_beat:
    build: ./backend
    container_name: mahjongscore-beat
    command: celery -A app.celery_app.celery beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=mysql+pymysql://root:secret@db:3306/mahjongscore
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - db
      - redis

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - '8025:8025' # Web UI
      - '1025:1025' # SMTP port
volumes:
  db_data:
