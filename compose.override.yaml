services:
  api:
    command: gunicorn --reload -b 0.0.0.0:5000 "app:create_app()"
    volumes: [./backend:/app]
    environment:
      FLASK_ENV: development
  db:
    ports: ["127.0.0.1:${DEV_MYSQL_PORT:-3307}:3306"]
  celery_worker:
    volumes: [./backend:/app]
    environment:
      FLASK_ENV: development
  celery_beat:
    volumes: [./backend:/app]
    environment:
      FLASK_ENV: development
  frontend:
    build:
      target: development
    ports: ["${DEV_FRONTEND_PORT:-5173}:5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:6080}
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
      VITE_USE_HTTPS: ${VITE_USE_HTTPS:-false}
      VITE_SHARE_ORIGIN: ${VITE_SHARE_ORIGIN:-mahjongapp-dev://}
      ORVAL_API_URL: http://api:5000/doc/openapi.json
    command: sh -c 'npm ci && npm run orval && npm run dev -- --host 0.0.0.0'
    depends_on:
      api:
        condition: service_healthy
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    ports:
      - '6080:6080' # API入口
      - '127.0.0.1:8090:8090' # mitmweb GUI
      - '127.0.0.1:9099:9099' # Maestro用制御API

    volumes:
      - ./scripts/mitmproxy:/addons:ro

    command:
      - mitmweb
      - --mode
      - reverse:http://api:5000
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - '6080'
      - --web-host
      - 0.0.0.0
      - --web-port
      - '8090'
      - --set
      - web_password=mahjong
      - -s
      - /addons/network_fault.py

    depends_on:
      - api
  mailhog:
    image: mailhog/mailhog
    ports:
      - '8025:8025' # Web UI
      - '1025:1025' # SMTP port
volumes:
  frontend_node_modules:
