services:
  api:
    command: gunicorn --reload -b 0.0.0.0:5000 "app:create_app()"
    volumes: [./backend:/app]
    environment:
      FLASK_ENV: development
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mahjongscore}
      MYSQL_USER: ${MYSQL_USER:-mahjong}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes: [db_data:/var/lib/mysql]
    networks: [default]
    ports: ["127.0.0.1:${DEV_MYSQL_PORT:-3307}:3306"]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -uroot "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
  celery_worker:
    volumes: [./backend:/app]
    environment:
      FLASK_ENV: development
    depends_on:
      db:
        condition: service_healthy
  celery_beat:
    volumes: [./backend:/app]
    environment:
      FLASK_ENV: development
    depends_on:
      db:
        condition: service_healthy
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    ports:
      - '6080:6080' # API入口
      - '127.0.0.1:8090:8090' # mitmweb GUI
      - '127.0.0.1:9099:9099' # Maestro用制御API

    volumes:
      - ./scripts/mitmproxy:/addons:ro

    command:
      - mitmweb
      - --mode
      - reverse:http://api:5000
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - '6080'
      - --web-host
      - 0.0.0.0
      - --web-port
      - '8090'
      - --set
      - web_password=mahjong
      - -s
      - /addons/network_fault.py

    depends_on:
      - api
  mailhog:
    image: mailhog/mailhog
    ports:
      - '8025:8025' # Web UI
      - '1025:1025' # SMTP port

volumes:
  # Keep this key unchanged: the default project still resolves it to the
  # existing mahjongscoreproject_db_data development volume.
  db_data:
