x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      # Allows CI/static validation to supply --env-file without creating a
      # second file. Normal development and production still load root .env.
      required: false
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in root .env (host db)}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  depends_on:
    redis:
      condition: service_healthy
  networks: [default]

services:
  api:
    <<: *backend
    command: gunicorn -b 0.0.0.0:5000 "app:create_app()"
    expose: ["5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 20s
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    networks: [default]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  celery_worker:
    <<: *backend
    command: celery -A app.celery_app.celery worker --loglevel=info
    stop_grace_period: 5m
  celery_beat:
    <<: *backend
    command: celery -A app.celery_app.celery beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    volumes: [celery_beat_data:/var/lib/celery]
volumes:
  redis_data:
  celery_beat_data:

networks:
  default:
