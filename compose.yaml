x-backend: &backend
  build: ./backend
  env_file: [.env]
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in root .env (host db)}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [default]

services:
  api:
    <<: *backend
    command: gunicorn -b 0.0.0.0:5000 "app:create_app()"
    expose: ["5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 20s
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mahjongscore}
      MYSQL_USER: ${MYSQL_USER:-mahjong}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes: [db_data:/var/lib/mysql]
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -uroot "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    networks: [default]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  celery_worker:
    <<: *backend
    command: celery -A app.celery_app.celery worker --loglevel=info
    stop_grace_period: 5m
  celery_beat:
    <<: *backend
    command: celery -A app.celery_app.celery beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    volumes: [celery_beat_data:/var/lib/celery]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    networks: [default]

volumes:
  # Keep the existing development volume key/project name to preserve its data.
  db_data:
  redis_data:
  celery_beat_data:

networks:
  default:
